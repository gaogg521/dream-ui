# Reverse-proxy snippet for exposing dream-trial-broker under an existing,
# already-TLS-terminated server block. Paste the block below inside the
# `server { ... }` that serves your public host (e.g. work.1oneclaw.com:443).
#
# Public base URL becomes:  https://<that-host>/trial-broker
# Give that value to aioncore as  DREAM_TRIAL_BROKER_URL.
#
# The broker itself listens only on 127.0.0.1:8787 (see .env / systemd unit).

# --- dream-trial-broker (OpenRouter trial key issuer) ---
# Internal ops endpoint must not be reachable from the public internet.
location = /trial-broker/internal/stats { return 404; }
location /trial-broker/internal/       { return 404; }

location /trial-broker/ {
    proxy_pass http://127.0.0.1:8787/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
}
# --- end dream-trial-broker ---
