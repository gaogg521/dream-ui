<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 0 880 500" fill="none">
  <defs>
    <linearGradient id="lo-bg" x1="0" y1="0" x2="880" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#090f1a"/><stop offset="1" stop-color="#05080e"/>
    </linearGradient>
    <linearGradient id="lo-accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#3b82f6"/><stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="lo-green" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#10b981"/><stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="lo-card" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#141d2d" stop-opacity=".95"/><stop offset="1" stop-color="#0d1422" stop-opacity=".98"/>
    </linearGradient>
    <pattern id="lo-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r=".7" fill="#334155" fill-opacity=".3"/>
    </pattern>
    <filter id="lo-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="880" height="500" rx="12" fill="url(#lo-bg)"/>
  <rect width="880" height="500" rx="12" fill="url(#lo-grid)" opacity=".6"/>
  <rect x="1" y="1" width="878" height="498" rx="11" stroke="rgba(255,255,255,.07)" fill="none"/>

  <!-- Top Header Bar -->
  <g transform="translate(24, 20)">
    <rect width="832" height="38" rx="8" fill="#0d1524" stroke="rgba(255,255,255,.08)"/>
    <rect x="12" y="10" width="160" height="20" rx="4" fill="rgba(59,130,246,.15)"/>
    <text x="20" y="24" fill="#60a5fa" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="800" letter-spacing=".04em">🏢 企业内网隔离与私有化协同拓扑</text>
    <g transform="translate(700, 11)">
      <circle cx="8" cy="8" r="4" fill="#22c55e"/>
      <text x="20" y="12" fill="#94a3b8" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="600">局域网部署 · 数据不出机房</text>
    </g>
  </g>

  <!-- Main Canvas Area -->
  
    <!-- Outer Intranet Boundary -->
    <g transform="translate(24, 75)" font-family="system-ui,-apple-system,sans-serif">
      <rect width="832" height="400" rx="14" fill="#0c1424" stroke="rgba(59,130,246,.35)" stroke-width="1.5"/>
      <rect x="1" y="1" width="830" height="38" rx="13" fill="#111c30"/>
      <circle cx="20" cy="19" r="5" fill="#22c55e"/>
      <text x="34" y="24" fill="#fff" font-size="13" font-weight="800">🛡️ 企业内网私有专区 (Air-Gapped Intranet / VPC 192.168.x.x)</text>
      <text x="814" y="24" text-anchor="end" fill="#38bdf8" font-size="11" font-weight="700">Docker 私有化镜像 · 离线授权</text>

      <!-- Center Server Node -->
      <g transform="translate(266, 56)" filter="url(#lo-glow)">
        <rect width="300" height="170" rx="12" fill="#132035" stroke="url(#lo-accent)" stroke-width="2"/>
        <rect x="1" y="1" width="298" height="34" rx="11" fill="#182a45"/>
        <text x="150" y="22" text-anchor="middle" fill="#fff" font-size="13" font-weight="900">🖥️ One Work WebUI 企业服务器</text>

        <g transform="translate(16, 48)">
          <rect width="268" height="30" rx="6" fill="#0a111e" stroke="rgba(255,255,255,.06)"/>
          <text x="12" y="19" fill="#38bdf8" font-family="monospace" font-size="11">http://192.168.1.100:8080</text>
          <text x="256" y="19" text-anchor="end" fill="#22c55e" font-size="10" font-weight="700">● 运行中</text>
        </g>

        <g transform="translate(16, 88)">
          <rect width="130" height="32" rx="6" fill="#0d1829" stroke="rgba(59,130,246,.25)"/>
          <text x="10" y="20" fill="#93c5fd" font-size="10" font-weight="700">🐳 Docker 容器部署</text>
          
          <rect x="138" width="130" height="32" rx="6" fill="#0d1829" stroke="rgba(251,191,36,.25)"/>
          <text x="148" y="20" fill="#fde68a" font-size="10" font-weight="700">🔑 离线 License 激活</text>
        </g>

        <g transform="translate(16, 128)">
          <text fill="#64748b" font-size="10">数据存储: 本地 SQLite / 企业 MySQL 直连</text>
        </g>
      </g>

      <!-- 4 Enterprise Feature Pods Around Server -->
      <!-- Left Pod 1: Issues -->
      <g transform="translate(24, 60)">
        <rect width="218" height="96" rx="10" fill="#111c2e" stroke="rgba(255,255,255,.08)"/>
        <text x="14" y="24" fill="#fff" font-size="12" font-weight="800">📋 Issues 需求流转看板</text>
        <text x="14" y="44" fill="#94a3b8" font-size="10">宏观需求一键拆分为 Story 卡片</text>
        <text x="14" y="62" fill="#94a3b8" font-size="10">全流程拖拽流转，指派 Agent 执行</text>
        <text x="14" y="80" fill="#22c55e" font-size="9" font-weight="700">✔ 任务进度全程可审计</text>
      </g>

      <!-- Left Pod 2: Digital Employee -->
      <g transform="translate(24, 168)">
        <rect width="218" height="96" rx="10" fill="#111c2e" stroke="rgba(255,255,255,.08)"/>
        <text x="14" y="24" fill="#fff" font-size="12" font-weight="800">🤖 企业级数字员工</text>
        <text x="14" y="44" fill="#94a3b8" font-size="10">专家角色 + 模型 + 定时计划</text>
        <text x="14" y="62" fill="#94a3b8" font-size="10">24/7 无人值守巡检与内容产出</text>
        <text x="14" y="80" fill="#22c55e" font-size="9" font-weight="700">✔ 支持离职检测与权限回收</text>
      </g>

      <!-- Right Pod 1: DLP Audit -->
      <g transform="translate(590, 60)">
        <rect width="218" height="96" rx="10" fill="#111c2e" stroke="rgba(255,255,255,.08)"/>
        <text x="14" y="24" fill="#fff" font-size="12" font-weight="800">🛡️ DLP 内容审计与安全基线</text>
        <text x="14" y="44" fill="#94a3b8" font-size="10">发送前阻断机密源码与敏感词</text>
        <text x="14" y="62" fill="#94a3b8" font-size="10">严格 / 标准 / 宽松 三档策略模板</text>
        <text x="14" y="80" fill="#22c55e" font-size="9" font-weight="700">✔ 13 语言安全审查规则覆盖</text>
      </g>

      <!-- Right Pod 2: Knowledge Base -->
      <g transform="translate(590, 168)">
        <rect width="218" height="96" rx="10" fill="#111c2e" stroke="rgba(255,255,255,.08)"/>
        <text x="14" y="24" fill="#fff" font-size="12" font-weight="800">📚 本地向量化团队知识库</text>
        <text x="14" y="44" fill="#94a3b8" font-size="10">内置向量化服务，无需外连模型</text>
        <text x="14" y="62" fill="#94a3b8" font-size="10">BM25 + 向量混合检索秒级响应</text>
        <text x="14" y="80" fill="#22c55e" font-size="9" font-weight="700">✔ 企业文档绝对不出内网</text>
      </g>

      <!-- Bottom LAN Member Workstations -->
      <g transform="translate(24, 280)">
        <rect width="784" height="100" rx="10" fill="#09101c" stroke="rgba(255,255,255,.06)"/>
        <text x="20" y="24" fill="#38bdf8" font-size="11" font-weight="800">👥 局域网成员工作终端 (LAN Client Workstations)</text>

        <g transform="translate(20, 36)">
          <rect width="230" height="50" rx="6" fill="#121d2d" stroke="rgba(255,255,255,.06)"/>
          <circle cx="20" cy="25" r="10" fill="rgba(59,130,246,.2)"/>
          <text x="20" y="29" text-anchor="middle" font-size="10">💻</text>
          <text x="38" y="22" fill="#fff" font-size="11" font-weight="700">研发工作站 A (Mac/Win)</text>
          <text x="38" y="38" fill="#64748b" font-size="9">直连内网 WebUI / CLI</text>
        </g>

        <g transform="translate(276, 36)">
          <rect width="230" height="50" rx="6" fill="#121d2d" stroke="rgba(255,255,255,.06)"/>
          <circle cx="20" cy="25" r="10" fill="rgba(6,182,212,.2)"/>
          <text x="20" y="29" text-anchor="middle" font-size="10">💻</text>
          <text x="38" y="22" fill="#fff" font-size="11" font-weight="700">业务协同端 B (WebUI)</text>
          <text x="38" y="38" fill="#64748b" font-size="9">需求提单 / 报告自动生成</text>
        </g>

        <g transform="translate(532, 36)">
          <rect width="230" height="50" rx="6" fill="#121d2d" stroke="rgba(34,197,94,.2)"/>
          <circle cx="20" cy="25" r="10" fill="rgba(34,197,94,.2)"/>
          <text x="20" y="29" text-anchor="middle" font-size="10">📊</text>
          <text x="38" y="22" fill="#fff" font-size="11" font-weight="700">管理后台 (Console)</text>
          <text x="38" y="38" fill="#22c55e" font-size="9">用量统计 / 审计看板 / 权限</text>
        </g>
      </g>
    </g>
    
</svg>