<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" fill="none">
  <defs>
    <linearGradient id="br-bg" x1="0" y1="0" x2="880" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#090f1a"/><stop offset="1" stop-color="#05080e"/>
    </linearGradient>
    <linearGradient id="br-accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#3b82f6"/><stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="br-green" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#10b981"/><stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="br-card" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#141d2d" stop-opacity=".95"/><stop offset="1" stop-color="#0d1422" stop-opacity=".98"/>
    </linearGradient>
    <pattern id="br-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r=".7" fill="#334155" fill-opacity=".3"/>
    </pattern>
    <filter id="br-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="880" height="500" rx="12" fill="url(#br-bg)"/>
  <rect width="880" height="500" rx="12" fill="url(#br-grid)" opacity=".6"/>
  <rect x="1" y="1" width="878" height="498" rx="11" stroke="rgba(255,255,255,.07)" fill="none"/>

  <!-- Top Header Bar -->
  <g transform="translate(24, 20)">
    <rect width="832" height="38" rx="8" fill="#0d1524" stroke="rgba(255,255,255,.08)"/>
    <rect x="12" y="10" width="160" height="20" rx="4" fill="rgba(59,130,246,.15)"/>
    <text x="20" y="24" fill="#60a5fa" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="800" letter-spacing=".04em">⚡ 官方 CLI 客户端无侵入本地桥接</text>
    <g transform="translate(700, 11)">
      <circle cx="8" cy="8" r="4" fill="#22c55e"/>
      <text x="20" y="12" fill="#94a3b8" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="600">127.0.0.1:8787 实时桥接</text>
    </g>
  </g>

  <!-- Main Canvas Area -->
  
    <!-- Left: Official Terminals -->
    <g transform="translate(24, 75)" font-family="system-ui,-apple-system,sans-serif">
