      <rect x="1" y="1" width="248" height="40" rx="13" fill="#132035"/>
      <text x="16" y="25" fill="#fff" font-size="13" font-weight="800">💻 官方原生 CLI 客户端</text>

      <!-- Terminal 1: Codex CLI -->
