          <circle cx="24" cy="33" r="12" fill="rgba(6,182,212,.2)"/>
          <text x="24" y="38" text-anchor="middle" fill="#22d3ee" font-size="11" font-weight="900">D</text>
          <text x="44" y="26" fill="#fff" font-size="12" font-weight="800">DeepSeek</text>
          <text x="44" y="42" fill="#22d3ee" font-size="10">DeepSeek-V3 / R1 推理</text>
          <text x="44" y="56" fill="#64748b" font-size="9">超高性价比 · 满血开源</text>
        </g>

        <!-- Model 3 -->
        <g transform="translate(0, 152)">
          <rect width="222" height="66" rx="8" fill="#131e2e" stroke="rgba(167,139,250,.2)"/>
          <circle cx="24" cy="33" r="12" fill="rgba(167,139,250,.2)"/>
          <text x="24" y="38" text-anchor="middle" fill="#c084fc" font-size="11" font-weight="900">K</text>
          <text x="44" y="26" fill="#fff" font-size="12" font-weight="800">Moonshot Kimi</text>
          <text x="44" y="42" fill="#c084fc" font-size="10">Kimi 200k 超长上下文</text>
          <text x="44" y="56" fill="#64748b" font-size="9">超大长文本快速检索分析</text>
        </g>

        <!-- Model 4 -->
        <g transform="translate(0, 228)">
          <rect width="222" height="66" rx="8" fill="#131e2e" stroke="rgba(34,197,94,.2)"/>
          <circle cx="24" cy="33" r="12" fill="rgba(34,197,94,.2)"/>
          <text x="24" y="38" text-anchor="middle" fill="#4ade80" font-size="11" font-weight="900">⚡</text>
          <text x="44" y="26" fill="#fff" font-size="12" font-weight="800">自建 / 私有网关</text>
          <text x="44" y="42" fill="#4ade80" font-size="10">Ollama / vLLM / 企微网关</text>
