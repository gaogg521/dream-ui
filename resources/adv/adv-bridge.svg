        <rect width="222" height="150" rx="10" fill="#060a12" stroke="rgba(255,255,255,.1)"/>
        <rect width="222" height="24" rx="9" fill="#151e2e"/>
        <circle cx="14" cy="12" r="3.5" fill="#ff5f57"/>
        <circle cx="24" cy="12" r="3.5" fill="#febc2e"/>
        <circle cx="34" cy="12" r="3.5" fill="#28c840"/>
        <text x="111" y="16" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="10">codex-cli</text>
        
        <g transform="translate(12, 38)" font-family="monospace">
