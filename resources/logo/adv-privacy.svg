<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" fill="none">
  <defs>
    <linearGradient id="pr-bg" x1="0" y1="0" x2="880" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#090f1a"/><stop offset="1" stop-color="#05080e"/>
    </linearGradient>
    <linearGradient id="pr-accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#3b82f6"/><stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="pr-green" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#10b981"/><stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="pr-card" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#141d2d" stop-opacity=".95"/><stop offset="1" stop-color="#0d1422" stop-opacity=".98"/>
    </linearGradient>
    <pattern id="pr-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r=".7" fill="#334155" fill-opacity=".3"/>
    </pattern>
    <filter id="pr-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="880" height="500" rx="12" fill="url(#pr-bg)"/>
  <rect width="880" height="500" rx="12" fill="url(#pr-grid)" opacity=".6"/>
  <rect x="1" y="1" width="878" height="498" rx="11" stroke="rgba(255,255,255,.07)" fill="none"/>

  <!-- Top Header Bar -->
  <g transform="translate(24, 20)">
    <rect width="832" height="38" rx="8" fill="#0d1524" stroke="rgba(255,255,255,.08)"/>
    <rect x="12" y="10" width="160" height="20" rx="4" fill="rgba(59,130,246,.15)"/>
    <text x="20" y="24" fill="#60a5fa" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="800" letter-spacing=".04em">🔒 物理级本地安全沙箱架构</text>
    <g transform="translate(700, 11)">
      <circle cx="8" cy="8" r="4" fill="#22c55e"/>
      <text x="20" y="12" fill="#94a3b8" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="600">数据 100% 留存本机</text>
    </g>
  </g>

  <!-- Main Canvas Area -->
  
    <!-- Local Sandbox Enclosure -->
    <g transform="translate(24, 75)">
      <rect width="570" height="400" rx="14" fill="#0e1726" stroke="url(#pr-accent)" stroke-width="1.5"/>
      <rect x="1" y="1" width="568" height="40" rx="13" fill="#132035"/>
      <circle cx="24" cy="20" r="6" fill="#22c55e"/>
      <text x="38" y="24" fill="#fff" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="800">💻 你的本地电脑沙箱 (Local Machine Boundary)</text>
      <text x="548" y="24" text-anchor="end" fill="#60a5fa" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="700">全私有执行环境</text>

      <!-- 4 Local Vault Cards -->
      <g transform="translate(18, 56)" font-family="system-ui,-apple-system,sans-serif">
        <!-- Card 1: API Key Vault -->
        <g>
          <rect width="258" height="145" rx="10" fill="#131e2e" stroke="rgba(255,255,255,.08)"/>
          <circle cx="28" cy="28" r="14" fill="rgba(251,191,36,.15)"/>
          <text x="28" y="33" text-anchor="middle" font-size="14">🔑</text>
          <text x="52" y="26" fill="#fff" font-size="13" font-weight="800">API Key 本地硬件金库</text>
          <text x="52" y="42" fill="#fbbf24" font-size="10" font-weight="700">AES-256 GCM 本机加密</text>
          
          <rect x="16" y="60" width="226" height="32" rx="6" fill="#0a101a" stroke="rgba(255,255,255,.06)"/>
          <text x="26" y="80" fill="#94a3b8" font-family="monospace" font-size="11">sk-live-••••••••••••7a9f</text>
          <text x="16" y="115" fill="#64748b" font-size="10">仅在发起请求时驻留内存，绝不落云端</text>
          <text x="16" y="130" fill="#22c55e" font-size="10" font-weight="700">✔ 零网络中转回传</text>
        </g>

        <!-- Card 2: Memory Storage -->
        <g transform="translate(276, 0)">
          <rect width="258" height="145" rx="10" fill="#131e2e" stroke="rgba(255,255,255,.08)"/>
          <circle cx="28" cy="28" r="14" fill="rgba(96,165,250,.15)"/>
          <text x="28" y="33" text-anchor="middle" font-size="14">🧠</text>
          <text x="52" y="26" fill="#fff" font-size="13" font-weight="800">长期记忆存储库</text>
          <text x="52" y="42" fill="#60a5fa" font-size="10" font-weight="700">~/OneWork/MEMORY.md</text>
          
          <rect x="16" y="60" width="226" height="32" rx="6" fill="#0a101a" stroke="rgba(255,255,255,.06)"/>
          <text x="26" y="80" fill="#94a3b8" font-family="monospace" font-size="11">SQLite + 本地 Markdown 索引</text>
          <text x="16" y="115" fill="#64748b" font-size="10">个人习惯与会话记忆全落本地磁盘</text>
          <text x="16" y="130" fill="#22c55e" font-size="10" font-weight="700">✔ 纯离线读取与检索</text>
        </g>

        <!-- Card 3: Project Workspace -->
        <g transform="translate(0, 160)">
          <rect width="258" height="145" rx="10" fill="#131e2e" stroke="rgba(255,255,255,.08)"/>
          <circle cx="28" cy="28" r="14" fill="rgba(34,197,94,.15)"/>
          <text x="28" y="33" text-anchor="middle" font-size="14">📁</text>
          <text x="52" y="26" fill="#fff" font-size="13" font-weight="800">工程项目工作区</text>
          <text x="52" y="42" fill="#34d399" font-size="10" font-weight="700">本地磁盘沙箱执行</text>
          
          <rect x="16" y="60" width="226" height="32" rx="6" fill="#0a101a" stroke="rgba(255,255,255,.06)"/>
          <text x="26" y="80" fill="#94a3b8" font-family="monospace" font-size="11">D:/projects/my-app/</text>
          <text x="16" y="115" fill="#64748b" font-size="10">代码生成、文件修改直接在电脑落盘</text>
          <text x="16" y="130" fill="#22c55e" font-size="10" font-weight="700">✔ 源码不经任何第三方中转</text>
        </g>

        <!-- Card 4: Rules & Config -->
        <g transform="translate(276, 160)">
          <rect width="258" height="145" rx="10" fill="#131e2e" stroke="rgba(255,255,255,.08)"/>
          <circle cx="28" cy="14" r="14" fill="rgba(167,139,250,.15)" transform="translate(0, 14)"/>
          <text x="28" y="33" text-anchor="middle" font-size="14">📜</text>
          <text x="52" y="26" fill="#fff" font-size="13" font-weight="800">团队规范与指令集</text>
          <text x="52" y="42" fill="#a78bfa" font-size="10" font-weight="700">CLAUDE.md / Rules</text>
          
          <rect x="16" y="60" width="226" height="32" rx="6" fill="#0a101a" stroke="rgba(255,255,255,.06)"/>
          <text x="26" y="80" fill="#94a3b8" font-family="monospace" font-size="11">.cursor/rules/ / prompt.md</text>
          <text x="16" y="115" fill="#64748b" font-size="10">自定义 Prompt 与团队开发规范私有化</text>
          <text x="16" y="130" fill="#22c55e" font-size="10" font-weight="700">✔ 离线解析，随项目流转</text>
        </g>
      </g>
    </g>

    <!-- Air Gap & Firewall Isolation -->
    <g transform="translate(612, 75)" font-family="system-ui,-apple-system,sans-serif">
      <rect width="244" height="400" rx="14" fill="#0a101a" stroke="rgba(239,68,68,.3)" stroke-dasharray="6 4"/>
      
      <rect x="16" y="20" width="212" height="32" rx="6" fill="rgba(239,68,68,.12)" stroke="rgba(239,68,68,.3)"/>
      <text x="122" y="40" text-anchor="middle" fill="#f87171" font-size="12" font-weight="900">🚫 物理网闸拦截层</text>

      <g transform="translate(16, 70)">
        <rect width="212" height="140" rx="10" fill="#111827" stroke="rgba(255,255,255,.06)"/>
        <circle cx="106" cy="40" r="22" fill="rgba(239,68,68,.1)"/>
        <text x="106" y="47" text-anchor="middle" font-size="20">☁️</text>
        <text x="106" y="80" text-anchor="middle" fill="#94a3b8" font-size="12" font-weight="700">第三方云端服务器</text>
        <rect x="26" y="96" width="160" height="24" rx="12" fill="#ef4444" fill-opacity=".2"/>
        <text x="106" y="112" text-anchor="middle" fill="#fca5a5" font-size="10" font-weight="800">已阻断代码与会话上传</text>
      </g>

      <g transform="translate(16, 226)">
        <rect width="212" height="150" rx="10" fill="#0f172a" stroke="rgba(59,130,246,.2)"/>
        <text x="16" y="26" fill="#38bdf8" font-size="12" font-weight="800">安全合规保障</text>
        <text x="16" y="50" fill="#94a3b8" font-size="11">✔ 零对话数据收集</text>
        <text x="16" y="72" fill="#94a3b8" font-size="11">✔ 零代码文件回传</text>
        <text x="16" y="94" fill="#94a3b8" font-size="11">✔ 零 API Key 云端托管</text>
        <text x="16" y="116" fill="#94a3b8" font-size="11">✔ 直连模型官方端点</text>
        <rect x="16" y="126" width="180" height="1" fill="rgba(255,255,255,.08)"/>
      </g>
    </g>
    
</svg>