appId: com.huanle.oneone.ai
productName: One Work
executableName: onework
# `executableName: onework` names every pre-launch surface: the Windows
# `onework.exe`, its default install dir (`Programs\onework`), the `.app`
# bundle and the DMG volume title. Dock/window/About still read CFBundleName
# ("One Work"). History: `1onecode` leaked the pre-rebrand name; it was then
# dropped entirely so productFilename fell back to "One Work" (spaces in a
# process name are awkward); `onework` is the final, space-free process name.
# Runtime identity (app.getName / userData dir) is independent — it is pinned in
# common/platform/index.ts (PROD_USERDATA_APP_NAME) and migrated on first launch.
# appId stays com.huanle.oneone.ai (Squirrel.Mac update matching + Windows
# uninstall registry GUID + signing-cert team are all keyed on it).
copyright: Copyright © 2026 1ONE

protocols:
  - name: One Work Protocol
    schemes:
      # `dream` is the current scheme. `aionui` stays registered so callbacks
      # from an older bundled aioncore (which maps unknown schemes back to it)
      # and links already stored by existing installs still open the app.
      - dream
      - aionui

asar:
  smartUnpack: true

# Chromium's own UI strings (context menus, spellcheck, IME candidate window) —
# NOT the app's i18n bundles, which live in the asar. Stock Electron ships 55
# locale paks (~44 MB on win32-x64) and the matching macOS .lproj set.
#
# This list must stay in sync with `supportedLanguages` in
# packages/desktop/src/common/config/i18n-config.json. Dropping a language the
# app's own UI supports leaves that user with a translated app and an English
# right-click menu.
#
# electron-builder matches the WANTED string against the FILE's language, so an
# entry has to be equal-or-more-specific than the filename: "ja-JP" keeps
# ja.pak (prefix match), but a bare "en" would DELETE en-US.pak. The macOS
# framework spells regional locales with underscores (zh_CN.lproj), which the
# hyphenated entries do not match, so those three are listed both ways.
# afterPack.js asserts the fallback locale survived — this option only warns
# when nothing matches.
electronLanguages:
  - en-US
  - zh-CN
  - zh-TW
  - ja-JP
  - ko-KR
  - tr-TR
  - ru-RU
  - uk-UA
  - pt-BR
  - de-DE
  - es-ES
  - fr-FR
  - fa-IR
  # macOS .lproj spellings for the regional entries above
  - zh_CN
  - zh_TW
  - pt_BR

directories:
  app: .
  output: out
  buildResources: resources

files:
  # electron-vite build output (main process + preload + renderer)
  - out/main/**/*
  - out/preload/**/*
  - out/renderer/**/*
  # Static resources — use explicit directory inclusion to prevent resource loss
  - public/**/*
  - package.json
  # Native modules and their runtime dependencies
  - node_modules/better-sqlite3/**/*
  - node_modules/bcrypt/**/*
  - node_modules/node-pty/**/*
  - node_modules/@mapbox/**/*
  - node_modules/detect-libc/**/*
  - node_modules/prebuild-install/**/*
  - node_modules/node-gyp-build/**/*
  - node_modules/bindings/**/*
  # CLI dependencies (needed by nested jackspeak/glob)
  - node_modules/@isaacs/cliui/**/*
  - node_modules/ansi-regex/**/*
  - node_modules/ansi-styles/**/*
  - node_modules/strip-ansi/**/*
  - node_modules/wrap-ansi/**/*
  - node_modules/string-width/**/*
  - node_modules/eastasianwidth/**/*
  - node_modules/emoji-regex/**/*
  # open library - needs to be external for Windows asar compatibility
  - node_modules/open/**/*
  - node_modules/default-browser/**/*
  - node_modules/default-browser-id/**/*
  - node_modules/run-applescript/**/*
  - node_modules/bundle-name/**/*
  # tree-sitter WASM dependencies
  - node_modules/web-tree-sitter/**/*
  - node_modules/tree-sitter-bash/**/*
  # CRITICAL: Exclude ALL tree-sitter native binaries to prevent signing issues
  - '!**/node_modules/tree-sitter-*/prebuilds/**'
  - '!**/node_modules/tree-sitter-*/build/**'
  - '!**/node_modules/tree-sitter-*/src/**'
  - '!**/node_modules/tree-sitter-*/**/*.node'
  - '!**/node_modules/tree-sitter-*/**/*.obj'
  - '!**/node_modules/tree-sitter-*/**/*.o'
  - '!**/node_modules/tree-sitter-*/**/*.cc'
  - '!**/node_modules/tree-sitter-*/**/*.c'
  # Exclude dev/test files
  - '!**/node_modules/*/{CHANGELOG.md,README.md,README,readme.md,readme}'
  - '!**/node_modules/*/{test,__tests__,tests,powered-test,example,examples}'
  - '!**/node_modules/*/{*.test.js,*.spec.js,*.test.ts,*.spec.ts}'
  # Defensive: exclude sibling packages from desktop bundle
  - '!packages/web-host/**'
  - '!packages/web-cli/**'
  - '!packages/shared-scripts/**'
  - '!packages/desktop/src/**'
  - '!**/node_modules/*.d.ts'
  - '!**/node_modules/.bin'
  - '!**/node_modules/*/{docs,documentation,doc}'
  # Exclude system files
  - '!**/{.DS_Store,.git,.gitignore,.gitattributes}'
  - '!**/{__pycache__,thumbs.db,.flowconfig,.idea,.vs,.nyc_output}'
  - '!**/{appveyor.yml,.travis.yml,circle.yml}'
  - '!**/{npm-debug.log,yarn.lock,.yarn-metadata.json,yarn-error.log}'
  # Exclude large packages
  - '!**/node_modules/{@img,@emnapi}/**'
  - '!**/node_modules/@img/sharp-*/**'
  # Renderer-only dependencies. The renderer config in electron.vite.config.ts
  # has no externalizeDepsPlugin, so Vite compiles these into out/renderer/assets
  # and the copies under node_modules are a second, unreachable one (~180 MB on
  # win32-x64: mermaid 24, @arco-design 15, pdfjs-dist 15, cytoscape 14, ...).
  #
  # Every entry below was verified to have zero references outside
  # packages/desktop/src/renderer before being listed. Do NOT extend this by
  # eyeballing package size: the MAIN process externalizes its dependencies, so
  # anything it requires must stay shipped or the app dies at startup with
  # "Cannot find module". React/react-dom are deliberately absent from this list
  # for that reason - @dream/web-host is bundled into the main process.
  - '!**/node_modules/mermaid/**'
  - '!**/node_modules/@arco-design/**'
  - '!**/node_modules/@icon-park/**'
  - '!**/node_modules/pdfjs-dist/**'
  - '!**/node_modules/cytoscape/**'
  - '!**/node_modules/cytoscape-*/**'
  - '!**/node_modules/@shikijs/**'
  - '!**/node_modules/katex/**'
  - '!**/node_modules/diff2html/**'
  - '!**/node_modules/@codemirror/**'
  - '!**/node_modules/@uiw/**'
  - '!**/node_modules/@monaco-editor/**'
  - '!**/node_modules/react-syntax-highlighter/**'
  - '!**/node_modules/streamdown/**'
  # Orphaned build-time tool: no package in node_modules declares it as a
  # dependency and no source file requires it.
  - '!**/node_modules/postject/**'
  # Demo/fixture payloads carried inside packages that are otherwise needed
  # (cytoscape-fcose/demo 8.2 MB, pptx2json/fixtures 4.6 MB).
  - '!**/node_modules/*/{demo,demos,fixture,fixtures,benchmark,benchmarks}'
  - '!**/node_modules/@*/*/{demo,demos,fixture,fixtures,benchmark,benchmarks}'
  # Exclude JAR files and JNI libraries that cause notarization issues
  - '!**/*.jar'
  - '!**/*.jnilib'
  # Exclude all vendor directories to prevent unsigned binaries
  - '!**/node_modules/*/vendor/**'
  - '!**/node_modules/@*/*/vendor/**'
  # Re-include vendor dirs for native modules that need them (if any)
  - 'node_modules/better-sqlite3/vendor/**'
  - 'node_modules/bcrypt/vendor/**'
  - 'node_modules/node-pty/vendor/**'
  # Exclude vite source maps
  - '!**/*.map'
  # Exclude syntax highlighter languages (keep common ones)
  - '!**/out/**/react-syntax-highlighter_languages_highlight_*'
  - 'out/**/react-syntax-highlighter_languages_highlight_{javascript,typescript,python,java,cpp,c,html,css,json,xml,yaml,shell,bash,dockerfile,sql,markdown,go,rust,php}'
  # Ensure vendor chunks from manual splitting are included
  - 'out/renderer/**/vendor-*.js'
  # Remap viteStaticCopy output (out/main/static/)
  # to root-level directories inside the asar, so runtime path resolution stays simple.
  - from: out/main/static
    to: static

extraResources:
  - from: public
    to: .
  - from: resources/app.png
    to: app.png
  # dreamcore binary + managed resources (pre-compiled per platform/arch,
  # prepared by scripts/shared-scripts/prepare-dreamcore.js)
  - from: resources/bundled-dreamcore
    to: bundled-dreamcore
  - from: resources/hub
    to: hub
win:
  target:
    - nsis
    #    - msi
  icon: resources/app.ico # Use the checked-in Windows icon resource for executable metadata/icon patching
  # Hyphenated, no spaces (see full rationale below at nsis.artifactName).
  artifactName: One-Work-${version}-${os}-${arch}.${ext}

nsis:
  # `useZip: true` (zip payload instead of the solid 7z/LZMA archive) was
  # measured and rejected on 2026-09-09. Decompressing the same 1.39 GB payload:
  # 7z/LZMA 21.7s from a 288 MB installer, zip 10.3s from a 458 MB one. It buys
  # 11.4s of install time for +170 MB of download, which only pays off above a
  # sustained ~120 Mbps — and the payload reduction in the same release already
  # cut ~14s off decompression on its own (the old 2.28 GB payload took ~36s).
  #
  # It is also mutually exclusive with differential updates by construction:
  # NsisTarget reads `!isBuildDifferentialAware && options.useZip`, so a future
  # `useZip: true` would be silently ignored while differentialPackage is on.
  # Re-measure before reconsidering; do not enable both and assume you got both.
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  # No spaces: GitHub silently rewrites spaces to dots in release asset
  # filenames on upload, but electron-updater's generated latest.yml keeps
  # the original (space-sanitized-to-hyphen) name — the two diverge and
  # auto-update can't find a matching asset. productName ("One Work") stays
  # space-containing for UI display (window title, shortcut, uninstaller);
  # only the on-disk/published artifact name is hyphenated.
  artifactName: One-Work-${version}-${os}-${arch}.${ext}
  # Emit a .blockmap next to the installer (and embed one in it) so
  # electron-updater fetches only changed blocks instead of the whole 288 MB
  # installer on every update. Inherited as `false` from the 1oneUI snapshot
  # with no rationale recorded; enabled 2026-09-09.
  #
  # Three things have to hold or this degrades silently to a full download:
  #  - `prepare-release-assets.sh` must collect *.blockmap (it now does, and
  #    fails the release when one is missing);
  #  - the blockmap must land beside the installer at releases/<version>/,
  #    which CdnGenericProvider.resolveFiles already produces because
  #    electron-updater appends ".blockmap" to the resolved installer URL;
  #  - the `upload_installers_only` input in _build-reusable.yml deletes
  #    blockmaps — leave it off for releases.
  #
  # The first update after this ships is still a full download: the diff needs
  # the previous installer cached in the updater's pending dir.
  #
  # x64 only in practice. build-with-builder.js passes
  # `--config.nsis.differentialPackage=false` for arm64, which keeps the zip
  # payload that arch has always used; the two options are mutually exclusive
  # in NsisTarget, so without that override arm64 would silently lose the zip.
  # prepare-release-assets.sh therefore only demands a blockmap for x64.
  differentialPackage: true

mac:
  target:
    - dmg
    - zip
  icon: resources/app.icns
  artifactName: One-Work-${version}-${os}-${arch}.${ext}
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: entitlements.plist
  entitlementsInherit: entitlements.plist

dmg:
  # Use UDZO format which is more reliable on CI
  format: UDZO
  # Disable internet-enabled DMG to avoid network issues
  internetEnabled: false
  # Simple window settings to avoid layout issues
  window:
    width: 540
    height: 380
  # Contents positioning
  contents:
    - x: 140
      y: 180
      type: file
    - x: 400
      y: 180
      type: link
      path: /Applications

afterPack: scripts/afterPack.js
afterSign: scripts/afterSign.js

linux:
  target:
    - deb
  icon: resources/app.png
  # Same space-free name as win/mac (see top-level executableName). productName
  # ("One Work") still drives the window title and the desktop-entry Name.
  executableName: onework
  # No spaces: GitHub silently rewrites spaces to dots in release asset
  # filenames on upload, but electron-updater's generated latest.yml keeps
  # the original (space-sanitized-to-hyphen) name — the two diverge and
  # auto-update can't find a matching asset. productName ("One Work") stays
  # space-containing for UI display (window title, shortcut, uninstaller);
  # only the on-disk/published artifact name is hyphenated.
  artifactName: One-Work-${version}-${os}-${arch}.${ext}
  category: Utility
  maintainer: 1ONE
  vendor: 1ONE
  synopsis: ${description}
  description: ${description}
  desktop:
    entry:
      Name: One Work
      Comment: ${description}
      Icon: one-work
      Categories: Office;Utility;
      MimeType: x-scheme-handler/aionui;

npmRebuild: false
buildDependenciesFromSource: false
nodeGypRebuild: false

asarUnpack:
  - '**/node_modules/better-sqlite3/**/*'
  - '**/node_modules/bcrypt/**/*'
  - '**/node_modules/node-pty/**/*'
  - '**/node_modules/@mapbox/**/*'
  - '**/node_modules/detect-libc/**/*'
  - '**/node_modules/prebuild-install/**/*'
  - '**/node_modules/node-gyp-build/**/*'
  - '**/node_modules/bindings/**/*'
  # open library and dependencies - needed for Windows asar compatibility
  - '**/node_modules/open/**/*'
  - '**/node_modules/default-browser/**/*'
  - '**/node_modules/default-browser-id/**/*'
  - '**/node_modules/run-applescript/**/*'
  - '**/node_modules/bundle-name/**/*'
  # tree-sitter WASM files need to be unpacked for fs.readFile access
  - '**/node_modules/web-tree-sitter/**/*'
  - '**/node_modules/tree-sitter-bash/**/*'
  # Builtin MCP server scripts must be unpacked so external node processes can execute them
  - 'out/main/builtin-mcp-image-gen.js'
  - 'out/main/builtin-mcp-export-pdf.js'
  - 'out/main/builtin-mcp-team-knowledge.js'
  - 'out/main/builtin-mcp-browser.js'
  - 'out/main/team-mcp-stdio.js'

# Compression level: normal for faster builds, maximum for smallest size
# Note: electron-builder doesn't support YAML template syntax for env vars
# The build script sets ELECTRON_BUILDER_COMPRESSION_LEVEL env var which takes precedence
compression: normal
removePackageScripts: true
electronDownload:
  cache: ${env.ELECTRON_CACHE}

# Auto-update feed. The runtime feed is set explicitly via setFeedURL() in
# autoUpdaterService (CDN_UPDATE_BASE_URL → the fork's own Tencent COS bucket);
# this block only decides what electron-builder bakes into app-update.yml and
# the generated latest-*.yml metadata. It must NOT point at the upstream
# iOfficeAI/AionUi GitHub repo, or forks would fetch upstream builds.
publish:
  provider: generic
  url: https://1onework-1251001122.cos.ap-shanghai.myqcloud.com/releases
  channel: latest
  publishAutoUpdate: true
